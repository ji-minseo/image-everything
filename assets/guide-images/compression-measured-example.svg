<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="t d"><title id="t">Measured compression sample byte sizes</title><desc id="d">Pillow 12.3.0 encoded the same 1600 by 1000 synthetic RGB image using five different settings. PNG 54.9 KiB; JPEG Q85 64.5 KiB; JPEG Q45 29.2 KiB; WebP lossless 33.9 KiB; WebP Q80 28.4 KiB.</desc><rect width="980" height="470" rx="24" fill="#faf8ff"/><text x="32" y="47" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#332454">One synthetic image, five encodings</text><text x="32" y="73" font-family="Arial,sans-serif" font-size="14" fill="#706284">1600 × 1000 RGB · Pillow 12.3.0 · measured output sizes</text><g font-family="Arial,sans-serif"><text x="32" y="118" font-size="16" fill="#332454">PNG optimized</text><rect x="215" y="98" width="489" height="30" rx="9" fill="#9a80dd"/><text x="810" y="119" font-size="16" fill="#332454">54.9 KiB</text><text x="32" y="180" font-size="16" fill="#332454">JPEG Q85</text><rect x="215" y="160" width="575" height="30" rx="9" fill="#6d50ca"/><text x="810" y="181" font-size="16" fill="#332454">64.5 KiB</text><text x="32" y="242" font-size="16" fill="#332454">JPEG Q45</text><rect x="215" y="222" width="260" height="30" rx="9" fill="#b2a0e1"/><text x="810" y="243" font-size="16" fill="#332454">29.2 KiB</text><text x="32" y="304" font-size="16" fill="#332454">WebP lossless</text><rect x="215" y="284" width="302" height="30" rx="9" fill="#7959c8"/><text x="810" y="305" font-size="16" fill="#332454">33.9 KiB</text><text x="32" y="366" font-size="16" fill="#332454">WebP Q80</text><rect x="215" y="346" width="253" height="30" rx="9" fill="#a790e2"/><text x="810" y="367" font-size="16" fill="#332454">28.4 KiB</text></g><text x="32" y="431" font-family="Arial,sans-serif" font-size="13" fill="#706284">Results for this specific controlled image; smaller files do not necessarily mean higher visual quality.</text></svg>