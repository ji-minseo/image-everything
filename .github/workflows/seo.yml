name: SEO and tool regression checks
on:
  pull_request:
    paths: ['**/*.html', 'assets/**', 'robots.txt', 'sitemap.xml', 'scripts/seo_audit.py', 'tests/**', '.github/workflows/seo.yml']
  push:
    branches: [main]
    paths: ['**/*.html', 'assets/**', 'robots.txt', 'sitemap.xml', 'scripts/seo_audit.py', 'tests/**', '.github/workflows/seo.yml']
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B scripts/seo_audit.py
      - run: python -B -m unittest discover -s tests -p seo_audit_test.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - name: Validate JavaScript syntax
        run: |
          for file in assets/*.js; do
            node --check "$file" || exit 1
          done
