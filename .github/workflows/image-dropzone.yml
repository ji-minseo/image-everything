name: Image dropzone accessibility checks
on:
  push:
    branches: [main]
    paths:
      - 'assets/tools.js'
      - 'assets/styles.css'
      - 'compress-image/**'
      - 'jpg-compressor/**'
      - 'png-compressor/**'
      - 'resize-image/**'
      - 'crop-image/**'
      - 'convert-image/**'
      - 'png-to-jpg/**'
      - 'jpg-to-png/**'
      - 'image-to-webp/**'
      - 'webp-to-jpg/**'
      - 'heic-to-jpg/**'
      - 'rotate-image/**'
      - 'image-info/**'
      - 'metadata-checker/**'
      - 'remove-exif/**'
      - 'tests/image-dropzone.test.js'
      - '.github/workflows/image-dropzone.yml'
  pull_request:
    paths:
      - 'assets/tools.js'
      - 'assets/styles.css'
      - '**/index.html'
      - 'tests/image-dropzone.test.js'
      - '.github/workflows/image-dropzone.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared script syntax
        run: node --check assets/tools.js
      - name: Check image dropzone accessibility
        run: node --test tests/image-dropzone.test.js
